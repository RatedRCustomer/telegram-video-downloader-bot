services:
  bot:
    build: .
    container_name: video-bot
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data:/app/data
    depends_on:
      - cobalt
      - tg-api
    healthcheck:
      # App-level liveness: heartbeat file mtime must be fresh (< 120s).
      # Catches stalled event loop, not just process existence.
      test: ["CMD-SHELL", "test $(($(date +%s) - $(stat -c %Y /app/data/.heartbeat 2>/dev/null || echo 0))) -lt 120"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  cobalt:
    image: ghcr.io/imputnet/cobalt:latest
    container_name: cobalt
    restart: unless-stopped
    environment:
      - API_URL=http://cobalt:9000/

  # Self-hosted Telegram Bot API server. Raises file upload limit 50MB → 2GB.
  # Requires bot to be `logOut`'d from cloud first (one-time):
  #   curl https://api.telegram.org/bot$BOT_TOKEN/logOut
  tg-api:
    image: aiogram/telegram-bot-api:latest
    container_name: tg-api
    restart: unless-stopped
    environment:
      - TELEGRAM_API_ID=${TELEGRAM_API_ID}
      - TELEGRAM_API_HASH=${TELEGRAM_API_HASH}
    volumes:
      - tg-api-state:/var/lib/telegram-bot-api

volumes:
  tg-api-state:
