services:
  bot:
    build: .
    container_name: video-bot
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data:/app/data
    depends_on:
      - cobalt
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'python.*bot.main' > /dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  cobalt:
    image: ghcr.io/imputnet/cobalt:latest
    container_name: cobalt
    restart: unless-stopped
    environment:
      - API_URL=http://cobalt:9000/
