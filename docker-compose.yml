services:
  bot:
    build: .
    container_name: video-bot
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data:/app/data
    depends_on:
      - cobalt
    healthcheck:
      # App-level liveness: heartbeat file mtime must be fresh (< 120s).
      # Catches stalled event loop, not just process existence.
      test: ["CMD-SHELL", "test $(($(date +%s) - $(stat -c %Y /app/data/.heartbeat 2>/dev/null || echo 0))) -lt 120"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  cobalt:
    image: ghcr.io/imputnet/cobalt:latest
    container_name: cobalt
    restart: unless-stopped
    environment:
      - API_URL=http://cobalt:9000/
